name: MusicBoard
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: musicboard-update-compatibility
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror verified MusicBoard update files
        run: python scripts/sync.py
        env:
          GH_TOKEN: ${{ github.token }}
